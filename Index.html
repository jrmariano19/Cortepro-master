<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CortePro Master</title>
<style>
:root {
--bg-base: #07090e;
--bg-card: rgba(17, 24, 39, 0.95);
--border-glass: rgba(255, 255, 255, 0.1);
--primary: #6366f1;
--primary-glow: rgba(99, 102, 241, 0.35);
--text-main: #f8fafc;
--text-muted: #94a3b8;
--accent: #10b981;
--accent-glow: rgba(16, 185, 129, 0.25);
--radius-lg: 18px;
--radius-md: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-base); color: var(--text-main); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
header { text-align: center; padding: 6px 0; }
.logo-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.35); padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; color: #818cf8; text-transform: uppercase; margin-bottom: 8px; }
header h1 { font-size: 1.75rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
header p { font-size: 0.85rem; color: var(--text-muted); }

.segmented-tabs { display: grid; grid-template-columns: 1fr 1fr; background: rgba(3, 7, 18, 0.8); border: 1px solid var(--border-glass); border-radius: 14px; padding: 4px; gap: 4px; }
.tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); }
.tab-content { display: none; flex-direction: column; gap: 14px; }
.tab-content.active { display: flex; }

.card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card-header { display: flex; align-items: center; gap: 12px; }
.card-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(99, 102, 241, 0.15); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.card-title h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
.card-title p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

.input-wrapper { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 13px 14px; background: rgba(3, 7, 18, 0.9); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: var(--text-main); font-size: 0.92rem; }
input:focus, select:focus { outline: none; border-color: var(--primary); }

.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%); color: white; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 0.98rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn-accent { background: linear-gradient(135deg, var(--accent) 0%, #059669 100%); color: #030712; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 0.98rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--border-glass); padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; text-decoration: none; text-align: center; }

.status-box { font-size: 0.84rem; color: var(--text-muted); text-align: center; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.3; }
.result-container { display: none; flex-direction: column; gap: 12px; background: rgba(3, 7, 18, 0.95); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: var(--radius-md); padding: 14px; }
.success-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-glow); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; width: fit-content; }

.clips-scroll { display: flex; flex-direction: column; gap: 12px; max-height: 420px; overflow-y: auto; }
.clip-row { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass); padding: 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 0.88rem; }
.clip-info { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 600; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo-badge">⚡ CortePro Master Pro</div>
<h1>CortePro</h1>
<p>Download de Redes Sociais & Divisor de Vídeos</p>
</header>

<div class="segmented-tabs">
<button class="tab-btn active" onclick="switchTab('download')">📥 Baixar Web</button>
<button class="tab-btn" onclick="switchTab('splitter')">✂️ Divisor</button>
</div>

<!-- ABA 1: BAIXAR WEB -->
<div id="tab-download" class="tab-content active">
<div class="card">
<div class="card-header">
<div class="card-icon">🌐</div>
<div class="card-title"><h2>Redes Sociais</h2><p>TikTok, Kwai, Instagram e Facebook</p></div>
</div>
<div class="input-wrapper">
<label for="videoUrl">Link da Publicação</label>
<input type="text" id="videoUrl" placeholder="Cole o link aqui...">
</div>
<button class="btn-primary" id="btnDownload" onclick="extractVideo()">Extrair Vídeo com Áudio</button>
<div id="statusDownload" class="status-box"></div>
<div id="downloadResult" class="result-container">
<div class="success-badge">✨ Vídeo Pronto</div>
<span id="videoTitle" style="font-size: 0.88rem; font-weight: 600;"></span>
<video id="webVideoPreview" style="width:100%; max-height:220px; border-radius:8px; background:#000;" controls playsinline></video>
<button class="btn-accent" id="saveBtn" onclick="saveToGalleryWeb()">💾 Guardar na Galeria / Partilhar</button>
<a id="directLinkFallback" class="btn-secondary" href="#" target="_blank" download="video_cortepro.mp4">Descarregar Diretamente no Navegador</a>
</div>
</div>
</div>

<!-- ABA 2: DIVISOR DE VÍDEO -->
<div id="tab-splitter" class="tab-content">
<div class="card">
<div class="card-header">
<div class="card-icon">✂️</div>
<div class="card-title"><h2>Divisor de Vídeos</h2><p>Fatie vídeos da sua galeria</p></div>
</div>
<div class="input-wrapper">
<label for="localVideo">Ficheiro de Vídeo</label>
<input type="file" id="localVideo" accept="video/*">
</div>
<div class="input-wrapper">
<label for="splitMode">Modo de Divisão</label>
<select id="splitMode" onchange="toggleSplitMode()">
<option value="parts">Por Número de Partes</option>
<option value="duration">Por Tempo (Segundos)</option>
</select>
</div>
<div class="input-wrapper" id="partsWrapper">
<label for="totalParts">Número de Partes</label>
<input type="number" id="totalParts" value="3" min="1" max="20">
</div>
<div class="input-wrapper" id="durationWrapper" style="display: none;">
<label for="chunkDuration">Duração por parte (Segundos)</label>
<input type="number" id="chunkDuration" value="30" min="5" max="300">
</div>
<button class="btn-primary" id="btnSplit" onclick="splitVideo()">Dividir Vídeo Agora</button>
<div id="statusSplit" class="status-box"></div>

<div id="splitResultsContainer" class="result-container">
<div class="success-badge">📦 Partes Prontas</div>
<div id="clipsList" class="clips-scroll"></div>
</div>
</div>
</div>
</div>

<script>
const BACKEND_API_URL = 'https://cortepro-master.onrender.com';
let currentExtractedUrl = '';

function switchTab(tabName) {
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
if (tabName === 'download') {
document.querySelectorAll('.tab-btn')[0].classList.add('active');
document.getElementById('tab-download').classList.add('active');
} else {
document.querySelectorAll('.tab-btn')[1].classList.add('active');
document.getElementById('tab-splitter').classList.add('active');
}
}

function toggleSplitMode() {
const mode = document.getElementById('splitMode').value;
document.getElementById('durationWrapper').style.display = mode === 'duration' ? 'flex' : 'none';
document.getElementById('partsWrapper').style.display = mode === 'parts' ? 'flex' : 'none';
}

async function extractVideo() {
const rawInput = document.getElementById('videoUrl').value.trim();
const statusEl = document.getElementById('statusDownload');
const resultBox = document.getElementById('downloadResult');
const btn = document.getElementById('btnDownload');
const titleEl = document.getElementById('videoTitle');
const previewEl = document.getElementById('webVideoPreview');
const fallbackLink = document.getElementById('directLinkFallback');

if (!rawInput) { alert('Insira um link válido.'); return; }
btn.disabled = true;
statusEl.innerHTML = '<div class="spinner"></div> A extrair vídeo do servidor Render...';
resultBox.style.display = 'none';

try {
const response = await fetch(${BACKEND_API_URL}/api/extract?url=${encodeURIComponent(rawInput)});
const data = await response.json();
if (data.success && data.videoUrl) {
currentExtractedUrl = data.videoUrl;
const proxyUrl = ${BACKEND_API_URL}/api/download-proxy?url=${encodeURIComponent(data.videoUrl)};
statusEl.textContent = 'Vídeo extraído com sucesso!';
titleEl.textContent = data.title || 'video_cortepro.mp4';
previewEl.src = proxyUrl;
fallbackLink.href = proxyUrl;
resultBox.style.display = 'flex';
} else {
statusEl.textContent = data.error || 'Não foi possível extrair o vídeo. Verifique se a publicação é pública.';
}
} catch (err) {
statusEl.textContent = 'O servidor Render está a acordar. Aguarde 20 segundos e tente novamente.';
}
btn.disabled = false;
}

async function saveToGalleryWeb() {
if (!currentExtractedUrl) return;
const statusEl = document.getElementById('statusDownload');
statusEl.innerHTML = '<div class="spinner"></div> A transferir para a galeria...';
const proxyUrl = ${BACKEND_API_URL}/api/download-proxy?url=${encodeURIComponent(currentExtractedUrl)};

try {
const res = await fetch(proxyUrl);
const blob = await res.blob();
const file = new File([blob], "cortepro_video.mp4", { type: "video/mp4" });

if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: 'Vídeo CortePro' });
statusEl.textContent = 'Partilhado com sucesso!';
} else {
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'cortepro_video.mp4';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
statusEl.textContent = 'Transferência concluída!';
}
} catch (e) {
window.open(proxyUrl, '_blank');
statusEl.textContent = 'A abrir o download no navegador...';
}
}

function formatTime(sec) {
const m = Math.floor(sec / 60);
const s = Math.floor(sec % 60);
return ${m}m${s &lt; 10 ? '0' : ''}${s}s`;
}

function splitVideo() {
const fileInput = document.getElementById('localVideo');
const mode = document.getElementById('splitMode').value;
const statusEl = document.getElementById('statusSplit');
const resultsContainer = document.getElementById('splitResultsContainer');
const clipsList = document.getElementById('clipsList');

if (fileInput.files.length === 0) { alert('Selecione primeiro um ficheiro de vídeo.'); return; }
const file = fileInput.files[0];
statusEl.innerHTML = '<div class="spinner"></div> A ler dados do vídeo sem travar...';
resultsContainer.style.display = 'none';
clipsList.innerHTML = '';

const video = document.createElement('video');
video.preload = 'metadata';

let metadataLoaded = false;
const fallbackTimer = setTimeout(() => {
if (!metadataLoaded) {
processSlicing(file, 60, true);
}
}, 3500);

video.onloadedmetadata = function() {
metadataLoaded = true;
clearTimeout(fallbackTimer);
window.URL.revokeObjectURL(video.src);
processSlicing(file, video.duration || 60, false);
};

video.onerror = function() {
metadataLoaded = true;
clearTimeout(fallbackTimer);
processSlicing(file, 60, true);
};

video.src = URL.createObjectURL(file);

function processSlicing(fileObj, totalDuration, isEstimated) {
const totalBytes = fileObj.size;
let partCount = 1;
let chunkDuration = 30;

if (mode === 'duration') {
chunkDuration = parseInt(document.getElementById('chunkDuration').value) || 30;
partCount = Math.max(1, Math.ceil(totalDuration / chunkDuration));
} else {
partCount = Math.max(1, parseInt(document.getElementById('totalParts').value) || 3);
chunkDuration = totalDuration / partCount;
}

resultsContainer.style.display = 'flex';
for (let i = 0; i < partCount; i++) {
const startByte = Math.floor((i / partCount) * totalBytes);
const endByte = Math.floor(((i + 1) / partCount) * totalBytes);
const chunkBlob = fileObj.slice(startByte, endByte, { type: 'video/mp4' });

const row = document.createElement('div');
row.className = 'clip-row';
row.innerHTML = &lt;div class="clip-info"&gt; &lt;span&gt;Parte${i + 1} de {isEstimated ? '' : '(' + formatTime(i * chunkDuration) + ' - ' + formatTime(Math.min((i + 1) * chunkDuration, totalDuration)) + ')'}</span>
</div>
<button class="btn-accent" onclick="downloadChunk(this, {i + 1} na Galeria</button>
; row.querySelector('button')._blobData = chunkBlob; clipsList.appendChild(row); } statusEl.textContent =Divisão pronta! ${partCount} partes geradas.;
}
}

async function downloadChunk(btn, index) {
const blob = btn._blobData;
if (!blob) return;
const file = new File([blob], parte_${index + 1}.mp4`, { type: 'video/mp4' });

if (navigator.canShare && navigator.canShare({ files: [file] })) {
try {
await navigator.share({ files: [file], title: Parte ${index + 1}` });
return;
} catch (e) {}
}

const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = parte_${index + 1}.mp4`;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
