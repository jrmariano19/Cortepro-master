name: CortePro tests

on:
  push:
    branches:
      - main
      - 'cortepro/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node.js matrix tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run test suite
        run: npm test
