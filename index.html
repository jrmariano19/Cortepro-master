<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master - Descarregador e Divisor de Vídeos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); margin-top: 20px; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; color: #fff; }
        .subtitle { font-size: 0.85rem; text-align: center; color: var(--text-muted); margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #0f172a; padding: 4px; border-radius: 10px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 0.9rem; }
        .tab.active { background: var(--primary); color: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        input[type="text"]:focus, select:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-box { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; }
        .status-box.loading { background: rgba(79, 70, 229, 0.15); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.3); display: block; }
        .status-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); display: block; }
        .status-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: block; }
        .result-area { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 12px; background: #000; }
        .platforms-hint { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
        .platforms-hint span { background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <h1>CortePro Master</h1>
        <p class="subtitle">Descarregador Limpo & Divisor de Vídeos</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('downloader')">Descarregador</button>
            <button class="tab" onclick="switchTab('splitter')">Divisor Local</button>
        </div>

        <!-- ABA DESCARREGADOR -->
        <div id="downloader" class="section active">
            <div class="platforms-hint">
                <span>TikTok</span><span>Kwai</span><span>Facebook</span><span>Instagram</span><span>YouTube</span>
            </div>
            <div class="form-group">
                <label for="videoUrl">Cole o link do vídeo:</label>
                <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/... ou Instagram/YouTube">
            </div>
            <button class="btn" id="extractBtn" onclick="extrairVideo()">Extrair Vídeo Limpo</button>
            
            <div id="statusBox" class="status-box">A ligar ao servidor... (servidor serverless a acordar, aguarde até 35s)</div>

            <div id="resultArea" class="result-area">
                <video id="previewVideo" controls></video>
                <a id="downloadLink" class="btn" style="background: var(--accent); margin-top: 10px;" target="_blank">Descarregar Vídeo</a>
            </div>
        </div>

        <!-- ABA DIVISOR -->
        <div id="splitter" class="section">
            <div class="form-group">
                <label for="localVideoFile">Selecione o vídeo local:</label>
                <input type="file" id="localVideoFile" accept="video/*">
            </div>
            <div class="form-group">
                <label for="splitDuration">Duração de cada parte (segundos):</label>
                <select id="splitDuration">
                    <option value="30">30 segundos (Reels/Shorts)</option>
                    <option value="60">60 segundos (1 Minuto)</option>
                    <option value="90">90 segundos</option>
                </select>
            </div>
            <button class="btn" onclick="alert('Divisor local pronto para processar o ficheiro selecionado.')">Dividir Vídeo</button>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if(tabName === 'downloader') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('downloader').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('splitter').classList.add('active');
            }
        }

        async function extrairVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusBox = document.getElementById('statusBox');
            const extractBtn = document.getElementById('extractBtn');
            const resultArea = document.getElementById('resultArea');
            const previewVideo = document.getElementById('previewVideo');
            const downloadLink = document.getElementById('downloadLink');

            if (!urlInput) {
                alert('Por favor, insira um link válido.');
                return;
            }

            extractBtn.disabled = true;
            resultArea.style.display = 'none';
            statusBox.className = 'status-box loading';
            statusBox.innerText = 'A ligar ao servidor e a extrair... (se estiver a acordar, pode demorar até 35s)';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 35000);

                const response = await fetch('/extrair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                const data = await response.json();

                if (data.success && (data.videoUrl || data.downloadUrl)) {
                    const finalUrl = data.videoUrl || data.downloadUrl;
                    statusBox.className = 'status-box success';
                    statusBox.innerText = 'Vídeo extraído com sucesso!';
                    
                    previewVideo.src = finalUrl;
                    downloadLink.href = finalUrl;
                    resultArea.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Falha ao extrair o vídeo.');
                }
            } catch (err) {
                statusBox.className = 'status-box error';
                statusBox.innerText = err.name === 'AbortError' 
                    ? 'O servidor demorou a acordar. Aguarde 10 segundos e clique em Extrair novamente.' 
                    : (err.message || 'Erro ao comunicar com o servidor.');
            } finally {
                extractBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
