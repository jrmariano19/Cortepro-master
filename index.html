<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master - Descarregador e Divisor de Vídeos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); margin-top: 20px; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; color: #fff; }
        .subtitle { font-size: 0.85rem; text-align: center; color: var(--text-muted); margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #0f172a; padding: 4px; border-radius: 10px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 0.9rem; }
        .tab.active { background: var(--primary); color: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        input[type="text"]:focus, select:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-box { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; word-break: break-word; }
        .status-box.loading { background: rgba(79, 70, 229, 0.15); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.3); display: block; }
        .status-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); display: block; }
        .status-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: block; }
        .result-area { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 12px; background: #000; }
        .platforms-hint { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
        .platforms-hint span { background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <h1>CortePro Master</h1>
        <p class="subtitle">Descarregador Limpo & Divisor de Vídeos</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('downloader')">Descarregador</button>
            <button class="tab" onclick="switchTab('splitter')">Divisor Local</button>
        </div>

        <!-- ABA DESCARREGADOR -->
        <div id="downloader" class="section active">
            <div class="platforms-hint">
                <span>TikTok</span><span>Kwai</span><span>Facebook</span><span>Instagram</span><span>YouTube</span>
            </div>
            <div class="form-group">
                <label for="videoUrl">Cole o link do vídeo:</label>
                <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/... ou Facebook/YouTube">
            </div>
            <button class="btn" id="extractBtn" onclick="extrairVideo()">Extrair Vídeo Limpo</button>
            
            <div id="statusBox" class="status-box"></div>

            <div id="resultArea" class="result-area">
                <video id="previewVideo" controls playsinline></video>
                <a id="downloadLink" class="btn" style="background: var(--accent); margin-top: 10px;" target="_blank" rel="noopener noreferrer">Descarregar Vídeo</a>
            </div>
        </div>

        <!-- ABA DIVISOR LOCAL -->
        <div id="splitter" class="section">
            <div class="form-group">
                <label for="localVideoFile">Selecione o vídeo do telemóvel:</label>
                <input type="file" id="localVideoFile" accept="video/*" onchange="carregarVideoLocal(event)">
            </div>
            <div class="form-group">
                <label for="splitDuration">Duração de cada corte (segundos):</label>
                <select id="splitDuration">
                    <option value="15">15 segundos (Stories)</option>
                    <option value="30" selected>30 segundos (Reels / Status)</option>
                    <option value="60">60 segundos (Shorts / TikTok)</option>
                    <option value="90">90 segundos</option>
                </select>
            </div>
            <button class="btn" id="splitBtn" onclick="dividirVideoLocal()">Gerar Cortes do Vídeo</button>
            <div id="splitStatus" class="status-box"></div>
            <div id="clipsContainer" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if (tabName === 'downloader') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('downloader').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('splitter').classList.add('active');
            }
        }

        // Função para desencurtar links /share/r/ ou /share/v/ do Facebook e extrair URL direta
        async function resolverEExtrairFacebook(fbUrl) {
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(fbUrl)}`;
                const res = await fetch(proxyUrl);
                const data = await res.json();
                const html = data.contents || '';

                // Procura URL direta de vídeo MP4 em HD ou SD no código-fonte da página do Facebook
                const hdMatch = html.match(/"playable_url_quality_hd":"([^"]+)"/) || html.match(/"browser_native_hd_url":"([^"]+)"/);
                const sdMatch = html.match(/"playable_url":"([^"]+)"/) || html.match(/"browser_native_sd_url":"([^"]+)"/);
                
                let rawVideo = (hdMatch && hdMatch[1]) || (sdMatch && sdMatch[1]);
                if (rawVideo) {
                    return rawVideo.replace(/\\u0025/g, '%').replace(/\\\//g, '/').replace(/\\u0026/g, '&');
                }

                // Se encontrou link canónico de reel/watch, retorna para passar no Cobalt
                const canonicalMatch = html.match(/https:\/\/www\.facebook\.com\/(reel|watch)\/[0-9]+/);
                if (canonicalMatch) {
                    return { resolvedUrl: canonicalMatch[0] };
                }
            } catch (e) {}
            return null;
        }

        async function extrairVideo() {
            let urlInput = document.getElementById('videoUrl').value.trim();
            const statusBox = document.getElementById('statusBox');
            const extractBtn = document.getElementById('extractBtn');
            const resultArea = document.getElementById('resultArea');
            const previewVideo = document.getElementById('previewVideo');
            const downloadLink = document.getElementById('downloadLink');

            if (!urlInput) {
                statusBox.className = 'status-box error';
                statusBox.innerText = 'Por favor, cole um link válido primeiro.';
                return;
            }

            extractBtn.disabled = true;
            resultArea.style.display = 'none';
            statusBox.className = 'status-box loading';
            statusBox.innerText = 'A desencurtar e extrair vídeo limpo... Aguarde alguns segundos.';

            let videoUrl = null;

            try {
                // 1. Motor Direto para TikTok (TikWM)
                if (urlInput.includes('tiktok.com')) {
                    try {
                        const tikRes = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                        const tikData = await tikRes.json();
                        if (tikData && tikData.data) {
                            const rawPlay = tikData.data.hdplay || tikData.data.play;
                            if (rawPlay) {
                                videoUrl = rawPlay.startsWith('http') ? rawPlay : `https://www.tikwm.com${rawPlay}`;
                            }
                        }
                    } catch (e) {}
                }

                // 2. Desbloqueador Especial para Facebook (/share/r/, /share/v/, /reel/)
                if (!videoUrl && (urlInput.includes('facebook.com') || urlInput.includes('fb.watch'))) {
                    const fbResult = await resolverEExtrairFacebook(urlInput);
                    if (typeof fbResult === 'string') {
                        videoUrl = fbResult;
                    } else if (fbResult && fbResult.resolvedUrl) {
                        urlInput = fbResult.resolvedUrl;
                    }
                }

                // 3. Motor Multiplataforma via instâncias públicas Cobalt (Direto + Proxy CORS)
                if (!videoUrl) {
                    const cobaltApis = [
                        'https://co.wuk.sh/api/json',
                        'https://cobalt.api.timelessnesses.me/api/json',
                        'https://api.cobalt.tools/api/json'
                    ];

                    for (const api of cobaltApis) {
                        if (videoUrl) break;
                        try {
                            const res = await fetch(api, {
                                method: 'POST',
                                headers: {
                                    'Accept': 'application/json',
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    url: urlInput,
                                    vQuality: '720',
                                    filenamePattern: 'basic',
                                    isNoTTWatermark: true
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.url) {
                                    videoUrl = data.url;
                                }
                            }
                        } catch (e) {}
                    }
                }

                if (videoUrl) {
                    statusBox.className = 'status-box success';
                    statusBox.innerText = 'Vídeo extraído com sucesso!';
                    previewVideo.src = videoUrl;
                    downloadLink.href = videoUrl;
                    resultArea.style.display = 'block';
                } else {
                    throw new Error('Não foi possível extrair diretamente deste link. Tente com outro vídeo público ou teste com um link do TikTok/Instagram/YouTube.');
                }
            } catch (err) {
                statusBox.className = 'status-box error';
                statusBox.innerText = err.message || 'Erro ao processar o vídeo.';
            } finally {
                extractBtn.disabled = false;
            }
        }

        // Divisor Local de Vídeo
        let selectedFileUrl = null;
        let videoDuration = 0;

        function carregarVideoLocal(event) {
            const file = event.target.files[0];
            const splitStatus = document.getElementById('splitStatus');
            const clipsContainer = document.getElementById('clipsContainer');
            clipsContainer.innerHTML = '';

            if (!file) return;
            selectedFileUrl = URL.createObjectURL(file);
            const tempVideo = document.createElement('video');
            tempVideo.src = selectedFileUrl;
            tempVideo.onloadedmetadata = () => {
                videoDuration = tempVideo.duration;
                splitStatus.className = 'status-box success';
                splitStatus.innerText = `Vídeo carregado (${Math.round(videoDuration)} segundos). Clique em Gerar Cortes.`;
            };
        }

        function dividirVideoLocal() {
            const splitStatus = document.getElementById('splitStatus');
            const clipsContainer = document.getElementById('clipsContainer');
            const step = parseInt(document.getElementById('splitDuration').value, 10);

            if (!selectedFileUrl || !videoDuration) {
                splitStatus.className = 'status-box error';
                splitStatus.innerText = 'Selecione um vídeo do seu telemóvel primeiro.';
                return;
            }

            clipsContainer.innerHTML = '';
            const totalParts = Math.ceil(videoDuration / step);
            splitStatus.className = 'status-box success';
            splitStatus.innerText = `Foram geradas ${totalParts} partes de ${step}s:`;

            for (let i = 0; i < totalParts; i++) {
                const start = i * step;
                const end = Math.min((i + 1) * step, Math.floor(videoDuration));
                const clipCard = document.createElement('div');
                clipCard.style.background = '#0f172a';
                clipCard.style.padding = '12px';
                clipCard.style.borderRadius = '8px';
                clipCard.style.border = '1px solid #334155';
                clipCard.innerHTML = `
                    <p style="font-size: 0.85rem; margin-bottom: 8px; color: #94a3b8;">
                        <strong>Parte ${i + 1}:</strong> ${start}s até ${end}s
                    </p>
                    <video src="${selectedFileUrl}#t=${start},${end}" controls style="max-height: 200px;"></video>
                `;
                clipsContainer.appendChild(clipCard);
            }
        }
    </script>
</body>
</html>
