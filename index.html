<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>CortePro Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .badge {
      background-color: #00b87c;
      color: #05291c;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }

    .tabs {
      display: flex;
      background-color: #131826;
      border-radius: 14px;
      padding: 5px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      border: 1px solid #1e2638;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background-color: #5b5bf6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(91, 91, 246, 0.35);
    }

    .card {
      background-color: #131826;
      border: 1px solid #1f293d;
      border-radius: 18px;
      padding: 22px 18px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8b9bb4;
      text-transform: uppercase;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      background-color: #090c14;
      border: 1px solid #28324a;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      background-color: #5b5bf6;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.6;
    }

    .status-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      background-color: #1a2133;
      border: 1px solid #2b354f;
      color: #e2e8f0;
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .status-box.success {
      background-color: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .status-box.warning {
      background-color: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fde68a;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #10b981;
      color: #042f2e;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }

    .rescue-box {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rescue-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      border: none;
      cursor: pointer;
      background-color: #2563eb;
      color: #ffffff;
    }

    .rescue-btn.insta {
      background-color: #ec4899;
    }

    .rescue-btn.face {
      background-color: #1d4ed8;
    }

    .rescue-btn.tube {
      background-color: #dc2626;
    }

    .link-limpo-box {
      margin-top: 12px;
      background: #090c14;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
    }

    .link-limpo-box input {
      font-size: 12px;
      margin-bottom: 8px;
      color: #38bdf8;
      background: #131826;
      border: 1px solid #1e293b;
      padding: 8px;
    }
