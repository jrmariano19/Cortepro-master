<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .result-area {
            margin-top: 16px;
            padding: 12px;
            background-color: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
        }

        .result-area.active {
            display: block;
        }

        .msg {
            font-size: 0.9rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .msg.error {
            color: var(--error);
        }

        .msg.success {
            color: var(--success);
        }

        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 300px;
            background: #000;
        }

        .parts-list {
            list-style: none;
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .parts-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .parts-list li:last-child {
            border-bottom: none;
        }

        .btn-download {
            padding: 10px 14px;
            background-color: var(--success);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CortePro Master</h1>
            <p>Baixe vídeos e divida arquivos para redes sociais</p>
        </header>

        <!-- FUNCIONALIDADE A: BAIXADOR -->
        <div class="card">
            <h2>📥 Baixador de Vídeos</h2>
            <div class="form-group">
                <label for="videoUrl">Cole o link público (TikTok, Instagram, Kwai, Facebook, YouTube):</label>
                <input type="text" id="videoUrl" placeholder="https://...">
            </div>
            <button id="btnExtract" onclick="extractVideo()">Processar e Baixar</button>
            
            <div id="extractResult" class="result-area">
                <div id="extractMsg" class="msg"></div>
                <div id="extractContainer"></div>
            </div>
        </div>

        <!-- FUNCIONALIDADE B: DIVISOR DE VÍDEOS -->
        <div class="card">
            <h2>✂️ Divisor de Vídeos Local</h2>
            <div class="form-group">
                <label for="localVideo">Selecione um vídeo da galeria:</label>
                <input type="file" id="localVideo" accept="video/*" onchange="loadLocalVideo(event)">
            </div>
            
            <div class="form-group">
                <label for="partDuration">Duração de cada parte (segundos):</label>
                <input type="number" id="partDuration" value="60" min="5" max="600">
            </div>

            <video id="previewVideo" controls style="display:none;"></video>
            
            <button id="btnSplit" onclick="splitVideo()" style="margin-top: 14px; display:none;">Dividir Vídeo Agora</button>

            <div id="splitResult" class="result-area">
                <div id="splitMsg" class="msg"></div>
                <ul id="partsList" class="parts-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://cortepro-master.onrender.com";

        // --- BAIXADOR DE VÍDEOS ---
        async function extractVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('btnExtract');
            const resultArea = document.getElementById('extractResult');
            const msgDiv = document.getElementById('extractMsg');
            const container = document.getElementById('extractContainer');

            if (!urlInput) {
                alert("Por favor, cole um link de vídeo válido.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Extraindo vídeo...';
            resultArea.classList.add('active');
            msgDiv.className = "msg";
            msgDiv.innerText = "Conectando ao servidor... (Se o servidor estiver em repouso, a 1ª vez pode levar até 40 segundos).";
            container.innerHTML = "";

            try {
                const response = await fetch(`${BACKEND_URL}/api/extract?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Falha ao extrair o vídeo.");
                }

                // Monta a URL completa apontando para a rota /api/download do Render
                const finalDownloadUrl = data.downloadUrl.startsWith('http')
                    ? data.downloadUrl
                    : `${BACKEND_URL}${data.downloadUrl}`;

                msgDiv.className = "msg success";
                msgDiv.innerText = `Vídeo pronto: ${data.title}`;

                container.innerHTML = `
                    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                        <a href="${finalDownloadUrl}" class="btn-download" style="width: 100%; padding: 14px;">
                            📥 Baixar Vídeo MP4 no Celular
                        </a>
                        ${data.directUrl ? `<a href="${data.directUrl}" target="_blank" rel="noopener" style="color: #94a3b8; font-size: 0.8rem; text-align: center; text-decoration: underline;">Abrir link direto alternativo</a>` : ''}
                    </div>
                `;
            } catch (err) {
                msgDiv.className = "msg error";
                if (err.message.includes("Failed to fetch")) {
                    msgDiv.innerText = "O servidor do Render está acordando ou atualizando. Aguarde 20 segundos e toque em 'Processar e Baixar' novamente.";
                } else {
                    msgDiv.innerText = err.message;
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Processar e Baixar';
            }
        }

        // --- DIVISOR DE VÍDEOS LOCAL ---
        let selectedFile = null;

        function loadLocalVideo(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            const videoElement = document.getElementById('previewVideo');
            const btnSplit = document.getElementById('btnSplit');
            
            videoElement.src = URL.createObjectURL(file);
            videoElement.style.display = 'block';
            btnSplit.style.display = 'block';
            
            document.getElementById('splitResult').classList.remove('active');
        }

        async function splitVideo() {
            if (!selectedFile) {
                alert("Selecione um vídeo primeiro.");
                return;
            }

            const partDuration = parseInt(document.getElementById('partDuration').value) || 60;
            const resultArea = document.getElementById('splitResult');
            const msgDiv = document.getElementById('splitMsg');
            const partsList = document.getElementById('partsList');
            const btn = document.getElementById('btnSplit');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Fatiando vídeo...';
            resultArea.classList.add('active');
            msgDiv.className = "msg";
            msgDiv.innerText = "Preparando partes do vídeo...";
            partsList.innerHTML = "";

            try {
                const fileSize = selectedFile.size;
                const videoElement = document.getElementById('previewVideo');
                
                setTimeout(() => {
                    const duration = (videoElement.duration && isFinite(videoElement.duration)) ? videoElement.duration : 60;
                    const bytesPerSecond = fileSize / duration;
                    const bytesPerPart = Math.ceil(bytesPerSecond * partDuration);

                    let start = 0;
                    let partIndex = 1;

                    while (start < fileSize) {
                        let end = Math.min(start + bytesPerPart, fileSize);
                        const chunk = selectedFile.slice(start, end, selectedFile.type || 'video/mp4');
                        const chunkUrl = URL.createObjectURL(chunk);

                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>Parte ${partIndex}</span>
                            <a href="${chunkUrl}" download="parte_${partIndex}_${selectedFile.name}" class="btn-download" style="padding: 6px 12px; font-size: 0.85rem;">Baixar Parte ${partIndex}</a>
                        `;
                        partsList.appendChild(li);

                        start = end;
                        partIndex++;
                    }

                    msgDiv.className = "msg success";
                    msgDiv.innerText = `Vídeo dividido em ${partIndex - 1} partes!`;
                    btn.disabled = false;
                    btn.innerHTML = 'Dividir Vídeo Novamente';
                }, 500);

            } catch (err) {
                msgDiv.className = "msg error";
                msgDiv.innerText = "Erro ao dividir o vídeo: " + err.message;
                btn.disabled = false;
                btn.innerHTML = 'Dividir Vídeo Agora';
            }
        }
    </script>
</body>
</html>
