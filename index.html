<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>CortePro 3.4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .badge {
      background-color: #00b87c;
      color: #05291c;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #f8fafc;
    }

    .tabs {
      display: flex;
      background-color: #131826;
      border-radius: 14px;
      padding: 5px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
      border: 1px solid #1e2638;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background-color: #5b5bf6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(91, 91, 246, 0.35);
    }

    .card {
      background-color: #131826;
      border: 1px solid #1f293d;
      border-radius: 18px;
      padding: 22px 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8b9bb4;
      text-transform: uppercase;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      background-color: #090c14;
      border: 1px solid #28324a;
      color: #ffffff;
      padding: 14px 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #5b5bf6;
    }

    .btn-primary {
      width: 100%;
      background-color: #5b5bf6;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      background-color: #1a2133;
      border: 1px solid #2b354f;
      color: #e2e8f0;
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-box.success {
      background-color: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .status-box.warning {
      background-color: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fde68a;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #10b981;
      color: #042f2e;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }

    .rescue-box {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rescue-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      background-color: #2563eb;
      color: #ffffff;
    }

    .rescue-btn.secondary {
      background-color: #0f766e;
    }

    video {
      width: 100%;
      max-height: 320px;
      border-radius: 12px;
      margin-top: 14px;
      background: #000;
    }

    .clips-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clip-item {
      background: #090c14;
      border: 1px solid #28324a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .clip-item a {
      background: #5b5bf6;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="badge">⚡ VERSÃO 3.4 ATIVA</div>
  <h1>CortePro</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabBaixar" onclick="trocarAba('baixar')">
      📥 Baixar Web
    </button>
    <button class="tab-btn" id="tabDivisor" onclick="trocarAba('divisor')">
      ✂️ Divisor
    </button>
  </div>

  <!-- ABA 1: BAIXAR DA WEB -->
  <div class="card" id="painelBaixar">
    <label for="videoUrl">LINK DO VÍDEO (TIKTOK, KWAI, INSTAGRAM, FB)</label>
    <input
      type="text"
      id="videoUrl"
      placeholder="Cole aqui o link do vídeo..."
      autocomplete="off"
    />
    <button class="btn-primary" id="btnExtrair" onclick="extrairVideoWeb()">
      Extrair Vídeo com Áudio
    </button>

    <div id="statusExtracao" class="status-box hidden"></div>

    <!-- ÁREA DE DOWNLOAD DIRETO QUANDO EXTRAÍDO INTERNAMENTE -->
    <div id="areaResultado" class="hidden">
      <button id="btnBaixarDireto" class="download-btn">
        ⬇️ Salvar Vídeo na Galeria (.MP4)
      </button>
      <video id="previewVideo" controls playsinline></video>
    </div>

    <!-- ÁREA DE RESGATE TURBO (CASO O FACEBOOK BLOQUEIE LINKS /SHARE/) -->
    <div id="areaResgate" class="rescue-box hidden">
      <button class="rescue-btn" onclick="abrirExtratorTurbo('fdown')">
        🚀 Baixar no Servidor Turbo 1 (Link já Copiado!)
      </button>
      <button class="rescue-btn secondary" onclick="abrirExtratorTurbo('snapsave')">
        ⚡ Baixar no Servidor Turbo 2 (Suporta Múltiplos Vídeos)
      </button>
    </div>
  </div>

  <!-- ABA 2: DIVISOR DE VÍDEOS LOCAL -->
  <div class="card hidden" id="painelDivisor">
    <label for="videoFile">ESCOLHA O VÍDEO DA SUA GALERIA</label>
    <input type="file" id="videoFile" accept="video/*" />

    <label for="tempoCorte">TEMPO DE CADA PARTE (EM SEGUNDOS)</label>
    <input type="number" id="tempoCorte" value="30" min="5" max="600" />

    <button class="btn-primary" id="btnDividir" onclick="dividirVideoLocal()">
      Dividir Vídeo Agora
    </button>

    <div id="statusDivisor" class="status-box hidden"></div>
    <div id="listaCortes" class="clips-list"></div>
  </div>

  <script>
    function trocarAba(aba) {
      const tabBaixar = document.getElementById('tabBaixar');
      const tabDivisor = document.getElementById('tabDivisor');
      const painelBaixar = document.getElementById('painelBaixar');
      const painelDivisor = document.getElementById('painelDivisor');

      if (aba === 'baixar') {
        tabBaixar.classList.add('active');
        tabDivisor.classList.remove('active');
        painelBaixar.classList.remove('hidden');
        painelDivisor.classList.add('hidden');
      } else {
        tabDivisor.classList.add('active');
        tabBaixar.classList.remove('active');
        painelDivisor.classList.remove('hidden');
        painelBaixar.classList.add('hidden');
      }
    }

    function mostrarStatus(el, msg, tipo = '') {
      el.className = 'status-box ' + tipo;
      el.innerHTML = msg;
      el.classList.remove('hidden');
    }

    function limparUrlEscapada(str) {
      if (!str) return null;
      return str
        .replace(/\\u0025/g, '%')
        .replace(/\\u0026/g, '&')
        .replace(/\\u002F/g, '/')
        .replace(/\\\//g, '/')
        .replace(/&amp;/g, '&');
    }

    // Fetch com Timeout rigoroso para NUNCA travar a tela
    async function fetchComTimeout(url, options = {}, timeoutMs = 5000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return res;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    // Motor 1: Microlink com Timeout de 5s
    async function motorMicrolink(url) {
      const endpoint = `https://api.microlink.io/?url=${encodeURIComponent(url)}&video=true&audio=true`;
      const res = await fetchComTimeout(endpoint, {}, 5500);
      if (!res.ok) throw new Error('Microlink falhou');
      const json = await res.json();
      if (json?.data?.video?.url && json.data.video.url.startsWith('http')) {
        return json.data.video.url;
      }
      throw new Error('Sem vídeo no Microlink');
    }

    // Motor 2: Cobalt API em paralelo com Timeout de 5s
    async function motorCobalt(url, apiBase) {
      const res = await fetchComTimeout(apiBase, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          url: url,
          videoQuality: '720',
          downloadMode: 'auto'
        })
      }, 5000);

      if (!res.ok) throw new Error('Cobalt falhou');
      const data = await res.json();
      if (data && (data.url || data.stream)) {
        return data.url || data.stream;
      }
      throw new Error('Sem URL no Cobalt');
    }

    // Motor 3: Extração HTML via Proxy Rápido com Timeout de 5s
    async function motorProxyHtml(url, proxyFn) {
      const res = await fetchComTimeout(proxyFn(url), {}, 5500);
      if (!res.ok) throw new Error('Proxy falhou');
      const html = await res.text();

      const padroes = [
        /"playable_url_quality_hd":"([^"]+)"/,
        /"playable_url":"([^"]+)"/,
        /"browser_native_hd_url":"([^"]+)"/,
        /"browser_native_sd_url":"([^"]+)"/,
        /property="og:video:secure_url"\s+content="([^"]+)"/i,
        /property="og:video"\s+content="([^"]+)"/i,
        /"contentUrl"\s*:\s*"([^"]+\.mp4[^"]*)"/i,
        /"video_url"\s*:\s*"([^"]+)"/i,
        /video_redirect\/\?src=([^"&]+)/i
      ];

      for (const regex of padroes) {
        const match = html.match(regex);
        if (match && match[1]) {
          const limpo = regex.source.includes('video_redirect')
            ? decodeURIComponent(match[1])
            : limparUrlEscapada(match[1]);
          if (limpo && limpo.startsWith('http')) return limpo;
        }
      }
      throw new Error('Não achou MP4 no HTML');
    }

    // Função de Resgate Turbo: Copia o link automaticamente e abre o servidor dedicado
    async function abrirExtratorTurbo(servidor) {
      const rawUrl = document.getElementById('videoUrl').value.trim();
      try {
        await navigator.clipboard.writeText(rawUrl);
      } catch (e) {
        // Continua mesmo se o navegador não deixar copiar
      }

      if (servidor === 'fdown') {
        // Envia via formulário POST direto para o FDown (já abre na página de download do vídeo!)
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://fdown.net/download.php';
        form.target = '_blank';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'URLz';
        input.value = rawUrl;

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
        form.remove();
      } else {
        window.open(`https://snapsave.app/pt`, '_blank');
      }
    }

    async function extrairVideoWeb() {
      const input = document.getElementById('videoUrl');
      const statusEl = document.getElementById('statusExtracao');
      const areaResultado = document.getElementById('areaResultado');
      const areaResgate = document.getElementById('areaResgate');
      const previewVideo = document.getElementById('previewVideo');
      const btnBaixarDireto = document.getElementById('btnBaixarDireto');
      const btnExtrair = document.getElementById('btnExtrair');

      let rawUrl = input.value.trim();
      if (!rawUrl) {
        mostrarStatus(statusEl, '⚠️ Por favor, cole o link de um vídeo primeiro.', 'error');
        return;
      }

      areaResultado.classList.add('hidden');
      areaResgate.classList.add('hidden');
      btnExtrair.disabled = true;
      mostrarStatus(statusEl, '⚡ A extrair em alta velocidade (máx. 6 segundos)...');

      try {
        let videoFinal = null;

        // 1. TIKTOK: API Direta Instantânea
        if (rawUrl.includes('tiktok.com')) {
          try {
            const tikRes = await fetchComTimeout(`https://www.tikwm.com/api/?url=${encodeURIComponent(rawUrl)}`, {}, 5000);
            const tikData = await tikRes.json();
            if (tikData?.data?.play) {
              videoFinal = tikData.data.play;
            }
          } catch (e) {
            console.warn('TikWM timeout');
          }
        }

        // 2. EXECUÇÃO EM PARALELO (NÃO TRAVA NUNCA!)
        // Dispara todos os motores juntos e pega o primeiro que responder em até 5.5 segundos
        if (!videoFinal) {
          try {
            videoFinal = await Promise.any([
              motorMicrolink(rawUrl),
              motorCobalt(rawUrl, 'https://cobalt-api.kwiatekmiki.com/'),
              motorCobalt(rawUrl, 'https://cobalt-backend.canine.tools/'),
              motorProxyHtml(rawUrl, (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`),
              motorProxyHtml(rawUrl, (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`)
            ]);
          } catch (agregateErr) {
            videoFinal = null;
          }
        }

        if (videoFinal) {
          mostrarStatus(statusEl, '✅ Vídeo extraído com sucesso! Pronto para salvar.', 'success');
          previewVideo.src = videoFinal;
          areaResultado.classList.remove('hidden');

          btnBaixarDireto.onclick = async () => {
            btnBaixarDireto.textContent = '⏳ A salvar MP4 na Galeria...';
            try {
              const
