<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master - Descarregador, Divisor Real MP4 & Hashtags</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); margin-top: 20px; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; color: #fff; }
        .subtitle { font-size: 0.85rem; text-align: center; color: var(--text-muted); margin-bottom: 24px; }
        .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: #0f172a; padding: 4px; border-radius: 10px; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 10px 8px; text-align: center; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 0.85rem; }
        .tab.active { background: var(--primary); color: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
        input[type="text"], input[type="number"], input[type="file"], select, textarea { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-box { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; word-break: break-word; }
        .status-box.loading { background: rgba(79, 70, 229, 0.15); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.3); display: block; }
        .status-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); display: block; }
        .status-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: block; }
        .result-area { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 12px; background: #000; }
        .platforms-hint { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
        .platforms-hint span { background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
        .clip-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-secondary { background: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CortePro Master <span style="font-size:0.75rem; color:#4ade80;">v12.0</span></h1>
        <p class="subtitle">Descarregador, Divisor Real MP4 & Hashtags</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('downloader')">Descarregador</button>
            <button class="tab" onclick="switchTab('splitter')">Divisor Local</button>
            <button class="tab" onclick="switchTab('hashtags')">Hashtags</button>
        </div>

        <!-- SECÇÃO 1: DESCARREGADOR -->
        <div id="downloader" class="section active">
            <div class="platforms-hint">
                <span>TikTok</span><span>Kwai</span><span>Facebook</span><span>Instagram</span><span>YouTube</span>
            </div>
            <div class="form-group">
                <label for="videoUrl">Cole o link do vídeo:</label>
                <input type="text" id="videoUrl" placeholder="Cole o link direto e público do vídeo">
            </div>
            <button class="btn" id="extractBtn" onclick="extrairVideo()">Extrair Vídeo Limpo</button>
            
            <div id="statusBox" class="status-box"></div>

            <div id="resultArea" class="result-area">
                <video id="previewVideo" controls playsinline></video>
                <a id="downloadLink" class="btn" style="background: var(--accent); margin-top: 10px;" target="_blank" rel="noopener noreferrer" download="cortepro_video.mp4">Descarregar Vídeo</a>
            </div>
        </div>

        <!-- SECÇÃO 2: DIVISOR LOCAL EM PARTES IGUAIS -->
        <div id="splitter" class="section">
            <div class="form-group">
                <label for="localVideoFile">Selecione o vídeo do telemóvel:</label>
                <input type="file" id="localVideoFile" accept="video/*" onchange="carregarVideoLocal(event)">
            </div>
            <div class="form-group">
                <label for="splitPartsCount">Dividir em quantas partes iguais?</label>
                <input type="number" id="splitPartsCount" value="4" min="2" max="50">
            </div>
            <button class="btn" id="splitBtn" onclick="dividirVideoLocal()">Gerar Partes Iguais</button>
            
            <button class="btn" id="downloadAllBtn" style="background: var(--accent); margin-top: 10px; display: none;" onclick="baixarTodasEmSequencia()">📥 Baixar Todas as Partes em Sequência</button>

            <div id="splitStatus" class="status-box"></div>
            
            <div id="playerPreviewContainer" style="display:none; margin-top:16px;">
                <video id="mainSplitVideo" controls playsinline></video>
            </div>

            <div id="clipsContainer" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- SECÇÃO 3: HASHTAGS -->
        <div id="hashtags" class="section">
            <div class="form-group">
                <label for="nicheSelect">Selecione o nicho do vídeo:</label>
                <select id="nicheSelect">
                    <option value="geral">Geral / Virais (Reels, TikTok, Shorts)</option>
                    <option value="filmes">Filmes, Séries & Doramas</option>
                    <option value="comedia">Comédia & Humor</option>
                    <option value="achadinhos">Ofertas & Achadinhos</option>
                    <option value="musica">Música & Clipes</option>
                </select>
            </div>
            <button class="btn" onclick="gerarHashtags()">Gerar Hashtags Virais</button>
            <div class="form-group" style="margin-top: 16px;">
                <label for="hashtagOutput">Hashtags prontas a copiar:</label>
                <textarea id="hashtagOutput" rows="5" readonly placeholder="Clique em gerar para obter as tags..."></textarea>
            </div>
            <button class="btn" style="background: var(--accent);" onclick="copiarHashtags()">📋 Copiar Hashtags</button>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if (tabName === 'downloader') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('downloader').classList.add('active');
            } else if (tabName === 'splitter') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('splitter').classList.add('active');
            } else if (tabName === 'hashtags') {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('hashtags').classList.add('active');
            }
        }

        async function extrairVideo() {
            let urlInput = document.getElementById('videoUrl').value.trim();
            const statusBox = document.getElementById('statusBox');
            const extractBtn = document.getElementById('extractBtn');
            const resultArea = document.getElementById('resultArea');
            const previewVideo = document.getElementById('previewVideo');
            const downloadLink = document.getElementById('downloadLink');

            if (!urlInput) {
                statusBox.className = 'status-box error';
                statusBox.innerText = 'Por favor, cole um link válido primeiro.';
                return;
            }

            extractBtn.disabled = true;
            resultArea.style.display = 'none';
            statusBox.className = 'status-box loading';
            statusBox.innerText = 'A processar extração... Aguarde alguns segundos.';

            let videoUrl = null;

            try {
                if (urlInput.includes('tiktok.com') || urlInput.includes('douyin.com')) {
                    try {
                        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                        const data = await res.json();
                        if (data && data.data) {
                            const play = data.data.hdplay || data.data.play;
                            if (play) videoUrl = play.startsWith('http') ? play : `https://www.tikwm.com${play}`;
                        }
                    } catch (e) {}
                }

                if (!videoUrl) {
                    const endpoints = ['https://api.cobalt.tools/api/json', 'https://co.wuk.sh/api/json'];
                    for (const api of endpoints) {
                        if (videoUrl) break;
                        try {
                            const response = await fetch(api, {
                                method: 'POST',
                                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                                body: JSON.stringify({ url: urlInput, vQuality: '720', isNoTTWatermark: true })
                            });
                            const text = await response.text();
                            if (text.trim().startsWith('{')) {
                                const json = JSON.parse(text);
                                if (json && json.url) videoUrl = json.url;
                            }
                        } catch (e) {}
                    }
                }

                if (videoUrl) {
                    statusBox.className = 'status-box success';
                    statusBox.innerText = 'Vídeo extraído com sucesso!';
                    previewVideo.src = videoUrl;
                    downloadLink.href = videoUrl;
                    resultArea.style.display = 'block';
                } else {
                    throw new Error('Não foi possível extrair este link. Certifique-se de que o vídeo é público.');
                }
            } catch (err) {
                statusBox.className = 'status-box error';
                statusBox.innerText = err.message || 'Erro ao processar o vídeo.';
            } finally {
                extractBtn.disabled = false;
            }
        }

        let selectedFile = null;
        let cachedFileUint8 = null;
        let selectedFileUrl = null;
        let videoDuration = 0;
        let generatedPartsList = [];
        let cutQueue = [];
        let isProcessingQueue = false;

        function carregarVideoLocal(event) {
            const file = event.target.files[0];
            const splitStatus = document.getElementById('splitStatus');
            const clipsContainer = document.getElementById('clipsContainer');
            const playerPreviewContainer = document.getElementById('playerPreviewContainer');
            const mainSplitVideo = document.getElementById('mainSplitVideo');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            clipsContainer.innerHTML = '';
            downloadAllBtn.style.display = 'none';

            if (!file) return;
            selectedFile = file;
            cachedFileUint8 = null;
            if (selectedFileUrl) URL.revokeObjectURL(selectedFileUrl);
            selectedFileUrl = URL.createObjectURL(file);

            mainSplitVideo.src = selectedFileUrl;
            playerPreviewContainer.style.display = 'block';

            mainSplitVideo.onloadedmetadata = () => {
                videoDuration = mainSplitVideo.duration;
                splitStatus.className = 'status-box success';
                splitStatus.innerText = `✅ Vídeo de ${videoDuration.toFixed(1)}s carregado. Escolha em quantas partes dividir.`;
            };
        }

        function verTrecho(start, end) {
            const v = document.getElementById('mainSplitVideo');
            v.currentTime = start;
            v.play();
            const checkEnd = setInterval(() => {
                if (v.currentTime >= end || v.paused) {
                    v.pause();
                    clearInterval(checkEnd);
                }
            }, 200);
        }

        function dividirVideoLocal() {
            const splitStatus = document.getElementById('splitStatus');
            const clipsContainer = document.getElementById('clipsContainer');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            const totalParts = parseInt(document.getElementById('splitPartsCount').value, 10);

            if (!selectedFile || !videoDuration) {
                splitStatus.className = 'status-box error';
                splitStatus.innerText = 'Selecione um vídeo do telemóvel primeiro.';
                return;
            }

            if (!totalParts || totalParts < 2) {
                splitStatus.className = 'status-box error';
                splitStatus.innerText = 'Informe pelo menos 2 partes iguais.';
                return;
            }

            clipsContainer.innerHTML = '';
            generatedPartsList = [];
            const partDuration = videoDuration / totalParts;
            splitStatus.className = 'status-box success';
            splitStatus.innerText = `✅ Vídeo de ${videoDuration.toFixed(1)}s dividido em ${totalParts} partes iguais (${partDuration.toFixed(1)}s cada):`;
            downloadAllBtn.style.display = 'flex';

            for (let i = 0; i < totalParts; i++) {
                const start = i * partDuration;
                const end = (i === totalParts - 1) ? videoDuration : (i + 1) * partDuration;
                const parteNum = i + 1;
                generatedPartsList.push({ start, end, parteNum });
                
                const clipCard = document.createElement('div');
                clipCard.style.background = '#0f172a';
                clipCard.style.padding = '12px';
                clipCard.style.borderRadius = '8px';
                clipCard.style.border = '1px solid #334155';
                clipCard.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size: 0.85rem; margin-bottom: 8px; color: #f8fafc;">
                        <strong>🎬 Parte ${parteNum} de ${totalParts}</strong>
                        <span style="color:#94a3b8;">${start.toFixed(1)}s até ${end.toFixed(1)}s</span>
                    </div>
                    <div class="clip-actions">
                        <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 10px; flex: 1;" onclick="verTrecho(${start}, ${end})">▶️ Ver Trecho</button>
                        <button class="btn" id="btnPart${parteNum}" style="background: var(--primary); font-size: 0.85rem; padding: 10px; flex: 1;" onclick="enfileirarCorte(${start}, ${end}, ${parteNum})">✂️ Baixar Parte ${parteNum}</button>
                    </div>
                `;
                clipsContainer.appendChild(clipCard);
            }
        }

        function baixarTodasEmSequencia() {
            for (const item of generatedPartsList) {
                enfileirarCorte(item.start, item.end, item.parteNum);
            }
        }

        function enfileirarCorte(start, end, parteNum) {
            const btn = document.getElementById(`btnPart${parteNum}`);
            if (cutQueue.some(q => q.parteNum === parteNum)) return;

            cutQueue.push({ start, end, parteNum });
            if (btn) {
                btn.disabled = true;
                btn.innerText = `⏳ Na fila (Parte ${parteNum})...`;
            }
            processarFilaDeCortes();
        }

        async function processarFilaDeCortes() {
            if (isProcessingQueue || cutQueue.length === 0) return;
            isProcessingQueue = true;

            const statusBox = document.getElementById('splitStatus');

            while (cutQueue.length > 0) {
                const { start, end, parteNum } = cutQueue.shift();
                const btn = document.getElementById(`btnPart${parteNum}`);

                if (btn) btn.innerText = `⏳ A cortar Parte ${parteNum}...`;
                statusBox.className = 'status-box loading';
                statusBox.innerText = `A cortar e gerar MP4 da Parte ${parteNum}... Aguarde.`;

                try {
                    if (!cachedFileUint8) {
                        const arrayBuffer = await selectedFile.arrayBuffer();
                        cachedFileUint8 = new Uint8Array(arrayBuffer);
                    }

                    const { createFFmpeg } = FFmpeg;
                    const ffmpeg = createFFmpeg({
                        log: false,
                        corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
                        mainName: 'main'
                    });
                    await ffmpeg.load();

                    ffmpeg.FS('writeFile', 'input.mp4', cachedFileUint8);

                    const outputName = `parte_${parteNum}.mp4`;
                    const duration = (end - start).toFixed(2);

                    await ffmpeg.run(
                        '-ss', String(start.toFixed(2)),
                        '-i', 'input.mp4',
                        '-t', String(duration),
                        '-c', 'copy',
                        '-avoid_negative_ts', 'make_zero',
                        '-movflags', '+faststart',
                        outputName
                    );

                    const data = ffmpeg.FS('readFile', outputName);
                    const validMp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
                    const downloadUrl = URL.createObjectURL(validMp4Blob);

                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `CortePro_Parte_${parteNum}.mp4`;
                    document.body.appendChild(a);
                    a.click();

                    await new Promise(r => setTimeout(r, 800));
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);

                    try {
                        ffmpeg.FS('unlink', 'input.mp4');
                        ffmpeg.FS('unlink', outputName);
                        ffmpeg.exit();
                    } catch (e) {}

                    if (btn) {
                        btn.innerText = `✅ Parte ${parteNum} Baixada`;
                        btn.style.background = 'var(--accent)';
                        btn.disabled = false;
                    }
                    statusBox.className = 'status-box success';
                    statusBox.innerText = `✅ Parte ${parteNum} baixada com sucesso!`;
                } catch (err) {
                    console.error(err);
                    statusBox.className = 'status-box error';
                    statusBox.innerText = `Erro ao cortar a Parte ${parteNum}: ${err.message || 'Tente novamente.'}`;
                    if (btn) {
                        btn.innerText = `✂️ Baixar Parte ${parteNum}`;
                        btn.disabled = false;
                    }
                }
            }

            isProcessingQueue = false;
        }

        function gerarHashtags() {
            const niche = document.getElementById('nicheSelect').value;
            const tagsMap = {
                geral: "#reels #tiktok #viral #foryou #explore #cortes #trending #fyp #brasil #foryoupage",
                filmes: "#filmes #series #doramas #kdrama #cenas #cortesdefilmes #dicasdefilmes #cinema #netflix #dramas",
                comedia: "#humor #comedia #engracado #risos #piada #memes #zueira #comediantes #divertido",
                achadinhos: "#achadinhos #ofertas #promocao #desconto #compras #shopee #mercadolivre #dicas #valeapena",
                musica: "#musica #sertanejo #anos90 #clipe #sucesso #hit #playlist #classicos #nostalgia"
            };
            document.getElementById('hashtagOutput').value = tagsMap[niche] || tagsMap.geral;
        }

        function copiarHashtags() {
            const textarea = document.getElementById('hashtagOutput');
            textarea.select();
            document.execCommand('copy');
            alert('Hashtags copiadas para a área de transferência!');
        }
    </script>
</body>
</html>
