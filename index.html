<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>CortePro 3.3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .badge {
      background-color: #00b87c;
      color: #05291c;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #f8fafc;
    }

    .tabs {
      display: flex;
      background-color: #131826;
      border-radius: 14px;
      padding: 5px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
      border: 1px solid #1e2638;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background-color: #5b5bf6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(91, 91, 246, 0.35);
    }

    .card {
      background-color: #131826;
      border: 1px solid #1f293d;
      border-radius: 18px;
      padding: 22px 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8b9bb4;
      text-transform: uppercase;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      background-color: #090c14;
      border: 1px solid #28324a;
      color: #ffffff;
      padding: 14px 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #5b5bf6;
    }

    .btn-primary {
      width: 100%;
      background-color: #5b5bf6;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      background-color: #1a2133;
      border: 1px solid #2b354f;
      color: #e2e8f0;
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-box.success {
      background-color: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #10b981;
      color: #042f2e;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-height: 320px;
      border-radius: 12px;
      margin-top: 14px;
      background: #000;
    }

    .clips-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clip-item {
      background: #090c14;
      border: 1px solid #28324a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .clip-item a {
      background: #5b5bf6;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="badge">⚡ VERSÃO 3.3 ATIVA</div>
  <h1>CortePro</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabBaixar" onclick="trocarAba('baixar')">
      📥 Baixar Web
    </button>
    <button class="tab-btn" id="tabDivisor" onclick="trocarAba('divisor')">
      ✂️ Divisor
    </button>
  </div>

  <!-- ABA 1: BAIXAR DA WEB -->
  <div class="card" id="painelBaixar">
    <label for="videoUrl">LINK DO VÍDEO (TIKTOK, KWAI, INSTAGRAM, FB)</label>
    <input
      type="text"
      id="videoUrl"
      placeholder="Cole aqui o link do vídeo..."
      autocomplete="off"
    />
    <button class="btn-primary" id="btnExtrair" onclick="extrairVideoWeb()">
      Extrair Vídeo com Áudio
    </button>

    <div id="statusExtracao" class="status-box hidden"></div>
    <div id="areaResultado" class="hidden">
      <button id="btnBaixarDireto" class="download-btn">
        ⬇️ Salvar Vídeo na Galeria (.MP4)
      </button>
      <video id="previewVideo" controls playsinline></video>
    </div>
  </div>

  <!-- ABA 2: DIVISOR DE VÍDEOS LOCAL -->
  <div class="card hidden" id="painelDivisor">
    <label for="videoFile">ESCOLHA O VÍDEO DA SUA GALERIA</label>
    <input type="file" id="videoFile" accept="video/*" />

    <label for="tempoCorte">TEMPO DE CADA PARTE (EM SEGUNDOS)</label>
    <input type="number" id="tempoCorte" value="30" min="5" max="600" />

    <button class="btn-primary" id="btnDividir" onclick="dividirVideoLocal()">
      Dividir Vídeo Agora
    </button>

    <div id="statusDivisor" class="status-box hidden"></div>
    <div id="listaCortes" class="clips-list"></div>
  </div>

  <script>
    function trocarAba(aba) {
      const tabBaixar = document.getElementById('tabBaixar');
      const tabDivisor = document.getElementById('tabDivisor');
      const painelBaixar = document.getElementById('painelBaixar');
      const painelDivisor = document.getElementById('painelDivisor');

      if (aba === 'baixar') {
        tabBaixar.classList.add('active');
        tabDivisor.classList.remove('active');
        painelBaixar.classList.remove('hidden');
        painelDivisor.classList.add('hidden');
      } else {
        tabDivisor.classList.add('active');
        tabBaixar.classList.remove('active');
        painelDivisor.classList.remove('hidden');
        painelBaixar.classList.add('hidden');
      }
    }

    function mostrarStatus(el, msg, tipo = '') {
      el.className = 'status-box ' + tipo;
      el.innerHTML = msg;
      el.classList.remove('hidden');
    }

    function limparUrlEscapada(str) {
      if (!str) return null;
      return str
        .replace(/\\u0025/g, '%')
        .replace(/\\u0026/g, '&')
        .replace(/\\u002F/g, '/')
        .replace(/\\\//g, '/')
        .replace(/&amp;/g, '&');
    }

    // PASSO 1: Usa a API Microlink (simula o robô oficial do WhatsApp/Facebook)
    // Ela consegue abrir links /share/r/ sem cair na tela de login e extrair o MP4 direto!
    async function extrairViaMicrolink(targetUrl) {
      const tentativas = [
        `https://api.microlink.io/?url=${encodeURIComponent(targetUrl)}&video=true&audio=true&prerender=true`,
        `https://api.microlink.io/?url=${encodeURIComponent(targetUrl)}&video=true`
      ];

      let resolvedUrl = targetUrl;

      for (const endpoint of tentativas) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const json = await res.json();

          if (json && json.data) {
            if (json.data.url && !json.data.url.includes('/share/r/')) {
              resolvedUrl = json.data.url;
            }
            if (json.data.video && json.data.video.url && json.data.video.url.includes('http')) {
              return {
                videoUrl: json.data.video.url,
                resolvedUrl: resolvedUrl
              };
            }
          }
        } catch (e) {
          console.warn('Microlink tentativa falhou:', e);
        }
      }

      return { videoUrl: null, resolvedUrl: resolvedUrl };
    }

    // PASSO 2: Desencurtador extra caso o link ainda tenha /share/r/
    async function desencurtarLinkFacebook(url) {
      if (!url.includes('/share/')) return url;

      try {
        // Usa Jina Reader API (que renderiza a página em nuvem e retorna a URL final limpa)
        const res = await fetch(`https://r.jina.ai/${url}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.data && data.data.url && !data.data.url.includes('/share/')) {
            return data.data.url;
          }
        }
      } catch (e) {
        console.warn('Erro ao desencurtar via Jina:', e);
      }
      return url;
    }

    // PASSO 3: Extração direta no código fonte usando múltiplos Proxies CORS
    async function extrairDiretoDoHtml(url) {
      const proxies = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
      ];

      const padroesVideo = [
        /"playable_url_quality_hd":"([^"]+)"/,
        /"playable_url":"([^"]+)"/,
        /"browser_native_hd_url":"([^"]+)"/,
        /"browser_native_sd_url":"([^"]+)"/,
        /property="og:video:secure_url"\s+content="([^"]+)"/i,
        /property="og:video"\s+content="([^"]+)"/i,
        /content="([^"]+)"\s+property="og:video:secure_url"/i,
        /content="([^"]+)"\s+property="og:video"/i,
        /"contentUrl"\s*:\s*"([^"]+\.mp4[^"]*)"/i,
        /"video_url"\s*:\s*"([^"]+)"/i,
        /sd_src\s*:\s*"([^"]+)"/,
        /hd_src\s*:\s*"([^"]+)"/,
        /video_redirect\/\?src=([^"&]+)/i
      ];

      // Testa na URL normal e na versão mbasic (que não exige login em vídeos públicos)
      const urlsParaTestar = [url];
      if (url.includes('facebook.com')) {
        urlsParaTestar.push(
          url.replace('www.facebook.com', 'mbasic.facebook.com').replace('m.facebook.com', 'mbasic.facebook.com')
        );
      }

      for (const target of urlsParaTestar) {
        for (const montarProxy of proxies) {
          try {
            const res = await fetch(montarProxy(target));
            if (!res.ok) continue;
            const html = await res.text();
            if (!html || html.length < 200) continue;

            for (const regex of padroesVideo) {
              const match = html.match(regex);
              if (match && match[1]) {
                let candidato = match[1];
                if (regex.source.includes('video_redirect')) {
                  candidato = decodeURIComponent(candidato);
                } else {
                  candidato = limparUrlEscapada(candidato);
                }
                if (candidato && candidato.startsWith('http')) {
                  return candidato;
                }
              }
            }
          } catch (e) {
            // Tenta próximo proxy
          }
        }
      }
      return null;
    }

    // PASSO 4: Instâncias atualizadas de APIs públicas (Cobalt v10 / v7)
    async function tentarApisPublicas(url) {
      const endpoints = [
        'https://cobalt-api.kwiatekmiki.com/',
        'https://cobalt-backend.canine.tools/',
        'https://api.cobalt.blackcat.sweeux.org/',
        'https://cobalt.slpy.one/'
      ];

      for (const api of endpoints) {
        try {
          const res = await fetch(api, {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              url: url,
              videoQuality: '720',
              downloadMode: 'auto'
            })
          });

          if (!res.ok) continue;
          const data = await res.json();
          if (data && (data.url || data.stream)) {
            return data.url || data.stream;
          }
        } catch (e) {
          // Tenta próxima instância
        }
      }
      return null;
    }

    async function extrairVideoWeb() {
      const input = document.getElementById('videoUrl');
      const statusEl = document.getElementById('statusExtracao');
      const areaResultado = document.getElementById('areaResultado');
      const previewVideo = document.getElementById('previewVideo');
      const btnBaixarDireto = document.getElementById('btnBaixarDireto');
      const btnExtrair = document.getElementById('btnExtrair');

      let rawUrl = input.value.trim();
      if (!rawUrl) {
        mostrarStatus(statusEl, '⚠️ Por favor, cole o link de um vídeo primeiro.', 'error');
        return;
      }

      areaResultado.classList.add('hidden');
      btnExtrair.disabled = true;
      mostrarStatus(statusEl, '⏳ Passo 1/3: A desencurtar link e buscar mídia...');

      try {
        let videoFinal = null;
        let urlResolvida = rawUrl;

        // 1. TIKTOK: Motor rápido TikWM (entrega MP4 direto com áudio)
        if (rawUrl.includes('tiktok.com')) {
          try {
            const tikRes = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(rawUrl)}`);
            const tikData = await tikRes.json();
            if (tikData && tikData.data && tikData.data.play) {
              videoFinal = tikData.data.play;
            }
          } catch (e) {
            console.warn('Erro no TikWM');
          }
        }

        // 2. MICROLINK API (Resolve /share/r/ do Facebook, Instagram e Kwai)
        if (!videoFinal) {
          const micro = await extrairViaMicrolink(rawUrl);
          if (micro.videoUrl) {
            videoFinal = micro.videoUrl;
          }
          if (micro.resolvedUrl && micro.resolvedUrl !== rawUrl) {
            urlResolvida = micro.resolvedUrl;
            // Se descobriu o link real (ex: facebook.com/reel/...), consulta o Microlink novamente com o link limpo!
            if (!videoFinal) {
              const micro2 = await extrairViaMicrolink(urlResolvida);
              if (micro2.videoUrl) videoFinal = micro2.videoUrl;
            }
          }
        }

        // 3. Se ainda estiver com /share/, tenta desencurtar via Jina e passar no Microlink
        if (!videoFinal && urlResolvida.includes('/share/')) {
          mostrarStatus(statusEl, '⏳ Passo 2/3: A converter link /share/r/ para link de Reel...');
          const urlJina = await desencurtarLinkFacebook(urlResolvida);
          if (urlJina && urlJina !== urlResolvida) {
            urlResolvida = urlJina;
            const micro3 = await extrairViaMicrolink(urlResolvida);
            if (micro3.videoUrl) videoFinal = micro3.videoUrl;
          }
        }

        // 4.Tenta via APIs públicas Cobalt e depois via HTML Proxy
        if (!videoFinal) {
          mostrarStatus(statusEl, '⏳ Passo 3/3: A extrair stream de vídeo com áudio...');
          videoFinal = await tentarApisPublicas(urlResolvida);
          if (!videoFinal && urlResolvida !== rawUrl) {
            videoFinal = await tentarApisPublicas(rawUrl);
          }
          if (!videoFinal) {
            videoFinal = await extrairDiretoDoHtml(urlResolvida);
          }
        }

        if (videoFinal) {
          mostrarStatus(statusEl, '✅ Vídeo extraído com sucesso! Pronto para salvar.', 'success');
          previewVideo.src = videoFinal;
          areaResultado.classList.remove('hidden');

          btnBaixarDireto.onclick = async () => {
            btnBaixarDireto.textContent = '⏳ A baixar MP4 para a Galeria...';
            try {
              const resp = await fetch(videoFinal);
              if (!resp.ok) throw new Error('CORS bloqueou fetch direto');
              const blob = await resp.blob();
              const blobUrl = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = blobUrl;
              a.download = `cortepro-${Date.now()}.mp4`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              btnBaixarDireto.textContent = '✅ Download Concluído!';
            } catch (err) {
              // Se o CDN do Facebook bloquear Blob no navegador, abre o MP4 direto para salvar
              const a = document.createElement('a');
              a.href = videoFinal;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.download = `cortepro-${Date.now()}.mp4`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              btnBaixarDireto.textContent = '⬇️ Salvar Vídeo na Galeria (.MP4)';
            }
          };
        } else {
          mostrarStatus(
            statusEl,
            '❌ Este vídeo está protegido por login do Facebook ou é privado. Dica rápida: no app do Facebook, clique nos 3 pontinhos do vídeo -> Copiar Link (ou abra no navegador para pegar o link facebook.com/reel/...).',
            'error'
          );
        }
      } catch (err) {
        mostrarStatus(statusEl, '❌ Ocorreu um erro ao processar o link.', 'error');
      } finally {
        btnExtrair.disabled = false;
      }
    }

    // FUNÇÃO DO DIVISOR LOCAL (100% NO NAVEGADOR)
    async function dividirVideoLocal() {
      const fileInput = document.getElementById('videoFile');
      const tempoInput = document.getElementById('tempoCorte');
      const statusDiv = document.getElementById('statusDivisor');
      const listaCortes = document.getElementById('listaCortes');

      if (!fileInput.files || !fileInput.files[0]) {
        mostrarStatus(statusDiv, '⚠️ Escolha um vídeo da sua galeria primeiro.', 'error');
        return;
      }

      const file = fileInput.files[0];
      const duracaoParte = parseInt(tempoInput.value, 10) || 30;
      listaCortes.innerHTML = '';
      mostrarStatus(statusDiv, '⏳ A carregar vídeo para calcular os cortes...');

      const urlLocal = URL.createObjectURL(file);
      const tempVideo = document.createElement('video');
      tempVideo.src = urlLocal;

      tempVideo.onloadedmetadata = () => {
        const duracaoTotal = tempVideo.duration;
        const totalPartes = Math.ceil(duracaoTotal / duracaoParte);

        mostrarStatus(
          statusDiv,
          `✅ Vídeo de ${Math.round(duracaoTotal)}s analisado! Foram geradas ${totalPartes} partes de até ${duracaoParte}s.`,
          'success'
        );

        for (let i = 0; i < totalPartes; i++) {
          const inicio = i * duracaoParte;
          const fim = Math.min((i + 1) * duracaoParte, Math.round(duracaoTotal));
          const item = document.createElement('div');
          item.className = 'clip-item';
          item.innerHTML = `
            <span>🎬 Parte ${i + 1} (${inicio}s até ${fim}s)</span>
            <a href="${urlLocal}#t=${inicio},${fim}" download="parte_${i + 1}_${file.name}">Baixar Parte ${i + 1}</a>
          `;
          listaCortes.appendChild(item);
        }
      };
    }
  </script>
</body>
</html>
