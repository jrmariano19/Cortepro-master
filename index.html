<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--text-main); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="url"] { width: 100%; padding: 14px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="url"]:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 0.9rem; text-align: center; display: none; }
        .status-box.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); display: block; }
        .status-box.success { background: rgba(99, 102, 241, 0.1); border: 1px solid var(--primary); color: #818cf8; display: block; }
        .footer-note { margin-top: 20px; text-align: center; font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CortePro Master</h1>
        <p class="subtitle">Baixe vídeos com áudio de forma rápida e direta</p>
        
        <div class="input-group">
            <label for="urlInput">Link do vídeo (TikTok, Instagram, Kwai, etc.)</label>
            <input type="url" id="urlInput" placeholder="https://..." autocomplete="off">
        </div>
        
        <button id="downloadBtn" onclick="processVideo()">Processar e baixar</button>
        
        <div id="statusBox" class="status-box"></div>
        
        <p class="footer-note">Processamento otimizado na nuvem. Use apenas conteúdo autorizado.</p>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusBox = document.getElementById('statusBox');
            const downloadBtn = document.getElementById('downloadBtn');

            statusBox.className = 'status-box';
            statusBox.style.display = 'none';

            if (!urlInput) {
                statusBox.textContent = 'Por favor, insira um link válido.';
                statusBox.className = 'status-box error';
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.textContent = 'Processando vídeo...';
            statusBox.textContent = 'A conectar com o servidor e extrair mídia...';
            statusBox.className = 'status-box success';

            try {
                // Utiliza API pública direta de extração para máxima velocidade sem erros de backend
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (!data || data.code !== 0 || !data.data || !data.data.play) {
                    throw new Error('Não foi possível extrair o vídeo. Verifique o link.');
                }

                statusBox.textContent = 'Vídeo pronto! A iniciar transferência...';
                window.location.href = data.data.play;
                
                setTimeout(() => {
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Processar e baixar';
                }, 3000);

            } catch (err) {
                statusBox.textContent = err.message || 'Erro ao processar vídeo.';
                statusBox.className = 'status-box error';
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'Processar e baixar';
            }
        }
    </script>
</body>
</html>
