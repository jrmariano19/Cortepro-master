<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortePro Master - Descarregador Limpo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background-color: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #loading {
            display: none;
            margin-top: 16px;
            color: #38bdf8;
            font-size: 14px;
        }
        #resultado {
            margin-top: 20px;
            display: none;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>CortePro Master</h1>
        <p>Descarregue vídeos sem marca d'água do TikTok, Kwai, Instagram, Facebook e YouTube.</p>

        <input type="text" id="urlInput" placeholder="Cole o link do vídeo aqui...">
        <button onclick="extrairVideo()">Extrair Vídeo Limpo</button>

        <div id="loading">A processar o vídeo no servidor, aguarde...</div>

        <div id="resultado">
            <a id="downloadBtn" class="btn-download" href="#" target="_blank">Guardar Vídeo MP4</a>
        </div>
    </div>

    <script>
        async function extrairVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const resultado = document.getElementById('resultado');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!url) {
                alert('Insira um link válido primeiro.');
                return;
            }

            loading.style.display = 'block';
            resultado.style.display = 'none';

            try {
                // Comunica diretamente com o SEU backend hospedado no Render
                const resposta = await fetch('https://cortepro-backend.onrender.com/extrair', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const dados = await resposta.json();

                if (dados.success && dados.downloadUrl) {
                    downloadBtn.href = dados.downloadUrl;
                    resultado.style.display = 'block';
                } else {
                    alert(dados.error || 'Não foi possível extrair o vídeo.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro ao ligar ao servidor de extração.');
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
